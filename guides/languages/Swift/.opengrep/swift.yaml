---
rules:
  - id: swift-no-force-try
    message: >-
      Don't use try! outside tests; handle the error with do/catch, or
      propagate it with try.
    severity: ERROR
    languages:
      - swift
    paths:
      exclude:
        - Tests/
    # Opengrep's Swift parser doesn't tell try! from try or try?, so also
    # match the text.
    patterns:
      - pattern: try! $EXPR
      - pattern-regex: \btry!
  - id: swift-no-force-cast
    message: >-
      Don't use as! outside tests; cast with as? and handle the nil case.
    severity: ERROR
    languages:
      - swift
    paths:
      exclude:
        - Tests/
    # Opengrep's Swift parser doesn't tell as! from as or as?, so also match
    # the text.
    patterns:
      - pattern: $EXPR as! $TYPE
      - pattern-regex: \bas!
  - id: swift-unchecked-sendable
    message: >-
      Don't use @unchecked Sendable to silence a warning; make the type
      Sendable, or say how it's made thread-safe in a comment on the line
      above.
    severity: WARNING
    languages:
      - swift
    # Match unless the line above is a comment (or the use is on line 1).
    pattern-regex: (?m)(?:\A|^(?![ \t]*//).*\n).*?\K@unchecked\s+Sendable
