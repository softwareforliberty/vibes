---
rules:
  - id: scala-no-as-instance-of
    message: >-
      Don't cast with asInstanceOf, which crashes at run time when the cast
      fails; match on the structure, or decode the value at the boundary.
    severity: ERROR
    languages:
      - scala
    pattern: $X.asInstanceOf[$T]
  - id: scala-no-await-result
    message: >-
      Don't block a thread with Await.result; compose the Future with map,
      flatMap or a for-comprehension instead.
    severity: WARNING
    languages:
      - scala
    pattern: Await.result(...)
  - id: scala-no-object-input-stream
    message: >-
      Don't deserialise with ObjectInputStream, which can run code chosen by
      whoever wrote the bytes; read a data format such as JSON instead.
    severity: ERROR
    languages:
      - scala
    pattern-either:
      - pattern: new ObjectInputStream(...)
      - pattern: new java.io.ObjectInputStream(...)
