---
rules:
  - id: clojure-no-core-read-string
    message: >-
      Don't read input with clojure.core/read-string, whose reader can run
      code; use clojure.edn/read-string instead.
    severity: ERROR
    languages:
      - clojure
    pattern-either:
      - pattern: (read-string ...)
      - pattern: (clojure.core/read-string ...)
  - id: clojure-no-eval
    message: >-
      Don't eval data that comes from outside the program, which runs whatever
      code that data contains; interpret the data instead.
    severity: ERROR
    languages:
      - clojure
    pattern: (eval ...)
  - id: clojure-no-catch-throwable
    message: >-
      Don't catch Throwable or Error, which include problems the program can't
      recover from; catch the specific exceptions this code can handle.
    severity: WARNING
    languages:
      - clojure
    # Opengrep can't match a catch clause on its own in Clojure, so match the
    # text.
    pattern-regex: \(catch\s+(?:java\.lang\.)?(?:Throwable|Error)\s
