---
rules:
  - id: objcpp-no-naked-new
    message: >-
      Don't call new directly; use std::make_unique, std::make_shared or a
      container, so ownership is never lost.
    severity: WARNING
    languages:
      - cpp
    pattern-either:
      - pattern: new $TYPE(...)
      - pattern: new $TYPE[$SIZE]
  - id: objcpp-no-naked-delete
    message: >-
      Don't call delete directly; let a smart pointer or container own the
      memory and free it.
    severity: WARNING
    languages:
      - cpp
    pattern-either:
      - pattern: delete $PTR;
      - pattern: delete[] $PTR;
  - id: objcpp-no-thread-detach
    message: >-
      Don't detach a thread; use std::jthread, which joins on destruction.
    severity: ERROR
    languages:
      - cpp
    pattern: $THREAD.detach()
  - id: objcpp-no-return-std-move
    message: >-
      Don't write return std::move(local); return the local by name so copy
      elision can apply.
    severity: WARNING
    languages:
      - cpp
    pattern: return std::move($VAR);
