---
rules:
  - id: sh-no-eval
    message: >-
      Don't use eval, which runs data as code; use the positional parameters,
      case or parameter expansion instead.
    severity: ERROR
    languages:
      - bash
    pattern: eval ...
  - id: sh-no-setuid
    message: >-
      Never make a script SUID or SGID; run it as another user with sudo
      instead.
    severity: ERROR
    languages:
      - bash
    pattern-regex: chmod\s+(?:[ugoa]*\+[rwx]*s|[2-7][0-7]{3}\b)
  - id: sh-no-fixed-tmp-path
    message: >-
      Create temporary files and directories with mktemp; a fixed name in /tmp
      can be predicted and created first by an attacker.
    severity: WARNING
    languages:
      - bash
    pattern-regex: (?:^|[\s"'=])/tmp/[A-Za-z0-9_.-]
  - id: sh-no-which
    message: >-
      Check that a program exists with command -v, which is built into the
      shell; which isn't.
    severity: WARNING
    languages:
      - bash
    pattern: which ...
